<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FruityWay - Orbis Arcade</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="game-container">
        <header class="game-header">
            <a href="../../index.html" class="back-btn">← ARCADE HALL</a>
            <h1 class="game-title">FRUITYWAY</h1>
            <div class="score-board">SCORE: <span id="score">0</span></div>
        </header>

        <!-- Voidvorka Boss Bereich -->
        <div id="boss-container">
            <img id="boss-sprite" src="https://i.postimg.cc/Jz4cyXHL/voidvruhig.png" alt="Voidvorka">
            <div id="boss-info">
                <span id="boss-name">Voidvorka</span>
                <div id="hp-bar-container">
                    <div id="hp-bar"></div>
                </div>
                <span id="hp-text">1000 / 1000 HP</span>
            </div>
        </div>

        <!-- Das Spielfeld-Raster -->
        <div id="grid-board" class="grid-board"></div>

        <!-- Kosmischer Shop -->
        <div class="shop-container">
            <div class="shop-title">KOSMISCHER SHOP</div>
            <div class="shop-items">
                <button class="shop-btn" id="btn-lotus" title="Lässt Voidvorka 3 Züge schlafen">
                    <img src="https://i.postimg.cc/2yRgmG5Q/fr10.png" alt="Galaxie Lotus">
                    <span>Lotus</span>
                    <span class="price">300 Pkt</span>
                </button>

                <button class="shop-btn" id="btn-shroom" title="Mischt alle Früchte neu">
                    <img src="https://i.postimg.cc/6prJQDZ1/fr17.png" alt="Saturn Pilz">
                    <span>Saturn Pilz</span>
                    <span class="price">150 Pkt</span>
                </button>

                <button class="shop-btn" id="btn-berry" title="Löscht eine gewählte Frucht komplett">
                    <img src="https://i.postimg.cc/QdSZhyVS/fr18.png" alt="Planetenbeere">
                    <span>Planetenbeere</span>
                    <span class="price">250 Pkt</span>
                </button>

                <button class="shop-btn" id="btn-coconut" title="Doppelte Punkte für 3 Matches">
                    <img src="https://i.postimg.cc/bJjZnXVJ/fr20.png" alt="Kosmos Kokosnuss">
                    <span>Kosmos Kokos</span>
                    <span class="price">200 Pkt</span>
                </button>
            </div>
        </div>

        <!-- Touch / Info Panel -->
        <div class="status-panel">
            <p id="game-status">Kombiniere 3 Früchte!</p>
        </div>
    </div>

    <script type="module" src="game.js"></script>
</body>
</html>
