<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>StarJump - CaeliX Arcade</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="game-container">
        <header class="game-header">
            <a href="../../index.html" class="back-btn">← ARCADE HALL</a>
            <h1 class="game-title">STARJUMP</h1>
            <div class="score-board">DISTANZ: <span id="score">0</span>m</div>
        </header>

        <!-- Canvas Spielfeld -->
        <div class="canvas-wrapper">
            <canvas id="gameCanvas" width="360" height="480"></canvas>
            
            <!-- Game Over / Start Overlay -->
            <div id="overlay" class="overlay">
                <h2 id="overlay-title">STARJUMP</h2>
                <p id="overlay-text">Klicke oder drücke LEERTASTE zum Starten!</p>
                <button id="start-btn">START</button>
            </div>
        </div>

        <div class="status-panel">
            <p id="game-status">Sammle Sterne für Schild-Schutz!</p>
        </div>
    </div>

    <script src="game.js"></script>
</body>
</html>
