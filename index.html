<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Orbis Arcade</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <header class="hero">
        <!-- Login & Spieler-Info oben rechts -->
        <div class="auth-container">
            <button id="login-btn" class="auth-btn">MIT GOOGLE ANMELDEN</button>
            <div id="user-info" class="user-info hidden">
                <span id="user-name">PLAYER: GUEST</span>
                <button id="logout-btn" class="logout-btn">LOGOUT</button>
            </div>
        </div>

        <h1 class="arcade-title">ORBIS ARCADE</h1>
        <p class="welcome-text">
            Willkommen in der Orbis Arcade. Wähle deinen Automaten, spiele Minispiele und entdecke die Welt von Orbis!
        </p>
    </header>

    <main class="arcade-hall">
        <div class="cabinet-container">
            
            <!-- Spielautomat 1: FruityWay -->
            <div class="arcade-cabinet">
                <div class="marquee">FRUITYWAY</div>
                <div class="screen">
                    <div class="pixel-art-placeholder">🍓 🍇 🍎</div>
                </div>
                <div class="controls">
                    <div class="joystick"></div>
                    <div class="buttons">
                        <span class="btn red"></span>
                        <span class="btn blue"></span>
                    </div>
                </div>
                <a href="games/fruityway/index.html" class="coin-btn">INSERT COIN (SPIELEN)</a>
            </div>

            <!-- Spielautomat 2: StarJump -->
            <div class="arcade-cabinet locked">
                <div class="marquee">STARJUMP</div>
                <div class="screen">
                    <div class="pixel-art-placeholder">⭐ 🚀 🌌</div>
                    <p class="blink">BALD VERFÜGBAR</p>
                </div>
                <div class="controls">
                    <div class="joystick"></div>
                    <div class="buttons">
                        <span class="btn yellow"></span>
                        <span class="btn green"></span>
                    </div>
                </div>
                <button class="coin-btn disabled" disabled>OFFLINE</button>
            </div>

            <!-- Spielautomat 3: Heroes Garden -->
            <div class="arcade-cabinet locked">
                <div class="marquee">HEROES GARDEN</div>
                <div class="screen">
                    <div class="pixel-art-placeholder">🌱 ⚔️ 🛡️</div>
                    <p class="blink">BALD VERFÜGBAR</p>
                </div>
                <div class="controls">
                    <div class="joystick"></div>
                    <div class="buttons">
                        <span class="btn red"></span>
                        <span class="btn yellow"></span>
                    </div>
                </div>
                <button class="coin-btn disabled" disabled>OFFLINE</button>
            </div>

        </div>
    </main>

    <footer>
        <p>&copy; 2026 Orbis Arcade • Press Start to Play</p>
    </footer>

    <!-- Firebase SDKs & Haupt-Skript als Modul einbinden -->
    <script type="module" src="script.js"></script>
</body>
</html>
