<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fruitway</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="game-container">
        <!-- Header / Stats -->
        <div class="game-header">
            <div class="stat-box">
                <span class="stat-label">Runde</span>
                <span id="roundNumber" class="stat-value">1</span>
            </div>
            <div class="stat-box">
                <span class="stat-label">Punkte</span>
                <span id="scoreValue" class="stat-value">0</span>
            </div>
        </div>

        <!-- Main Game Area -->
        <div class="game-main">
            <div class="character-area">
                <img id="voidvorkaImg" src="assets/voidvorka_neutral.png" alt="Voidvorka">
            </div>
            <div class="dialogue-box">
                <p id="dialogueText">Willkommen bei Fruitway! Wähle deine nächste Zutat.</p>
            </div>
        </div>

        <!-- Choices / Interaction Area -->
        <div id="choicesContainer" class="choices-container">
            <!-- Dynamische Buttons werden hier per JavaScript geladen -->
        </div>
    </div>

    <!-- JavaScript am Ende des Body eingebunden mit korrigiertem Dateinamen -->
    <script src="script.js"></script>
</body>
</html>
